apiVersion: apps/v1
kind: Deployment
metadata:
  name: musicshop-app
  namespace: musicshop-prod
  labels:
    app: musicshop
spec:
  replicas: 3
  selector:
    matchLabels:
      app: musicshop
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: musicshop
    spec:
      terminationGracePeriodSeconds: 60 # Dà tempo all'app di chiudere le connessioni al DB
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - musicshop
              topologyKey: kubernetes.io/hostname
      containers:
      - name: musicshop
        # SOSTITUISCI con l'immagine Docker effettiva del tuo progetto
        image: tuo-registry/musicshop:latest 
        imagePullPolicy: Always
        ports:
        - containerPort: 8080 # <-- Modifica se la tua app usa una porta diversa
        envFrom:
        - configMapRef:
            name: musicshop-config
        - secretRef:
            name: musicshop-secret
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: / # <-- Sostituisci con la rotta di healthcheck, es. /health o /actuator/health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
