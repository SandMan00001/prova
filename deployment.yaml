apiVersion: apps/v1
kind: Deployment
metadata:
  name: musicshop-app
  namespace: default
  labels:
    app: musicshop
spec:
  replicas: 1 # <-- Impostato a 1 per girare su un solo nodo
  selector:
    matchLabels:
      app: musicshop
  template:
    metadata:
      labels:
        app: musicshop
    spec:
      terminationGracePeriodSeconds: 30
      # Il blocco affinity è stato rimosso per permettere al pod di stare su un unico nodo senza vincoli
      containers:
      - name: musicshop
        image: tuo-registry/musicshop:latest # <-- Ricorda di mettere la tua immagine
        imagePullPolicy: Always
        ports:
        - containerPort: 8080 # <-- Modifica se usi una porta diversa
        envFrom:
        - configMapRef:
            name: musicshop-config
        - secretRef:
            name: musicshop-secret
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: / 
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
